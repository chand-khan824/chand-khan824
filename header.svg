<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chandu Lashari - Full-Stack Data Analyst">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#1a1a40;#0b3d4f;#0f0c29" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#302b63">
        <animate attributeName="stop-color" values="#302b63;#0b3d4f;#4b1d6b;#302b63" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#24243e">
        <animate attributeName="stop-color" values="#24243e;#0f766e;#24243e" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="txt" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="560" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00f5d4"/>
      <stop offset="0.5" stop-color="#7b61ff"/>
      <stop offset="1" stop-color="#ff4ecd"/>
      <animate attributeName="x1" values="60;360;60" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="560;860;560" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f5d4"/>
      <stop offset="1" stop-color="#7b61ff"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="round"><rect width="1000" height="300" rx="24"/></clipPath>
    <clipPath id="type">
      <rect x="60" y="150" height="50" width="0">
        <animate attributeName="width" values="0;390;390;0" keyTimes="0;0.45;0.9;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#grid)"/>

    <!-- scanning light -->
    <rect y="0" width="160" height="300" fill="url(#scan)">
      <animate attributeName="x" values="-160;1000" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- floating particles -->
    <g fill="#ffffff">
      <circle cx="90" cy="250" r="2" opacity="0.5"><animate attributeName="cy" values="250;40;250" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="180" cy="270" r="1.5" opacity="0.5"><animate attributeName="cy" values="270;60;270" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="11s" repeatCount="indefinite"/></circle>
      <circle cx="290" cy="260" r="2.5" opacity="0.5"><animate attributeName="cy" values="260;30;260" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="400" cy="280" r="1.5" opacity="0.5"><animate attributeName="cy" values="280;50;280" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="510" cy="255" r="2" opacity="0.5"><animate attributeName="cy" values="255;35;255" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="275" r="2" opacity="0.5"><animate attributeName="cy" values="275;45;275" dur="7.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="7.5s" repeatCount="indefinite"/></circle>
      <circle cx="700" cy="265" r="1.5" opacity="0.5"><animate attributeName="cy" values="265;25;265" dur="13s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="13s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="270" r="2.5" opacity="0.5"><animate attributeName="cy" values="270;40;270" dur="9.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9.5s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="258" r="2" opacity="0.5"><animate attributeName="cy" values="258;30;258" dur="10.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="10.5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- animated bar chart -->
    <g filter="url(#glow)" opacity="0.95">
      <rect x="640" y="170" width="26" height="60" rx="5" fill="url(#bar)"><animate attributeName="height" values="60;110;80;60" dur="3.2s" repeatCount="indefinite"/><animate attributeName="y" values="170;120;150;170" dur="3.2s" repeatCount="indefinite"/></rect>
      <rect x="680" y="130" width="26" height="100" rx="5" fill="url(#bar)"><animate attributeName="height" values="100;70;130;100" dur="2.8s" repeatCount="indefinite"/><animate attributeName="y" values="130;160;100;130" dur="2.8s" repeatCount="indefinite"/></rect>
      <rect x="720" y="180" width="26" height="50" rx="5" fill="url(#bar)"><animate attributeName="height" values="50;120;90;50" dur="3.6s" repeatCount="indefinite"/><animate attributeName="y" values="180;110;140;180" dur="3.6s" repeatCount="indefinite"/></rect>
      <rect x="760" y="100" width="26" height="130" rx="5" fill="url(#bar)"><animate attributeName="height" values="130;90;150;130" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="100;140;80;100" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="800" y="140" width="26" height="90" rx="5" fill="url(#bar)"><animate attributeName="height" values="90;140;70;90" dur="3.4s" repeatCount="indefinite"/><animate attributeName="y" values="140;90;160;140" dur="3.4s" repeatCount="indefinite"/></rect>
      <rect x="840" y="160" width="26" height="70" rx="5" fill="url(#bar)"><animate attributeName="height" values="70;100;130;70" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="160;130;100;160" dur="2.6s" repeatCount="indefinite"/></rect>
      <rect x="880" y="110" width="26" height="120" rx="5" fill="url(#bar)"><animate attributeName="height" values="120;150;100;120" dur="3.8s" repeatCount="indefinite"/><animate attributeName="y" values="110;80;130;110" dur="3.8s" repeatCount="indefinite"/></rect>
      <rect x="920" y="90" width="26" height="140" rx="5" fill="url(#bar)"><animate attributeName="height" values="140;100;160;140" dur="3.1s" repeatCount="indefinite"/><animate attributeName="y" values="90;130;70;90" dur="3.1s" repeatCount="indefinite"/></rect>
    </g>

    <!-- trend line -->
    <path d="M653 150 L693 120 L733 140 L773 95 L813 110 L853 80 L893 100 L933 60" fill="none" stroke="#ff4ecd" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1000" stroke-dasharray="1000" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" values="1000;0;0;1000" keyTimes="0;0.5;0.85;1" dur="6s" repeatCount="indefinite"/>
    </path>
    <g fill="#ffffff">
      <circle cx="773" cy="95" r="4"><animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="853" cy="80" r="4"><animate attributeName="r" values="3;6;3" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="933" cy="60" r="4"><animate attributeName="r" values="3;6;3" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- name -->
    <text x="60" y="120" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="url(#txt)" filter="url(#glow)" opacity="0">
      Chandu Lashari
      <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
    </text>

    <!-- typing subtitle -->
    <g clip-path="url(#type)">
      <text x="60" y="185" font-family="'Courier New', Consolas, monospace" font-size="26" font-weight="700" fill="#e6f1ff">Full-Stack Data Analyst</text>
    </g>
    <rect y="162" width="3" height="28" fill="#00f5d4">
      <animate attributeName="x" values="60;450;450;60" keyTimes="0;0.45;0.9;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>

    <!-- tagline -->
    <text x="60" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#9fb3c8" letter-spacing="1" opacity="0">
      SQL  •  Python  •  Power BI  •  Tableau  •  Data Storytelling
      <animate attributeName="opacity" values="0;1" dur="2s" begin="1.5s" fill="freeze"/>
    </text>

    <!-- waves -->
    <path fill="#00f5d4" fill-opacity="0.14" d="M0 255 Q125 235 250 255 T500 255 T750 255 T1000 255 V300 H0 Z">
      <animate attributeName="d" dur="6s" repeatCount="indefinite"
        values="M0 255 Q125 235 250 255 T500 255 T750 255 T1000 255 V300 H0 Z;M0 255 Q125 275 250 255 T500 255 T750 255 T1000 255 V300 H0 Z;M0 255 Q125 235 250 255 T500 255 T750 255 T1000 255 V300 H0 Z"/>
    </path>
    <path fill="#7b61ff" fill-opacity="0.16" d="M0 268 Q125 288 250 268 T500 268 T750 268 T1000 268 V300 H0 Z">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="M0 268 Q125 288 250 268 T500 268 T750 268 T1000 268 V300 H0 Z;M0 268 Q125 248 250 268 T500 268 T750 268 T1000 268 V300 H0 Z;M0 268 Q125 288 250 268 T500 268 T750 268 T1000 268 V300 H0 Z"/>
    </path>
  </g>
</svg>
